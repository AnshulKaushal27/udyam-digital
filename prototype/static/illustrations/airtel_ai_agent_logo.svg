<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="airtelAgentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E40000"/>
      <stop offset="100%" stop-color="#FF2E2E"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE5E5"/>
    </linearGradient>
    <filter id="agentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc with Subtle Shadow -->
  <circle cx="32" cy="32" r="30" fill="url(#airtelAgentGrad)"/>
  <!-- Ambient Orbit Ring -->
  <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Connectivity Wave Arcs -->
  <path d="M20 23 C26 18, 38 18, 44 23" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Intelligent 4-Point AI Sparkle -->
  <path d="M32 17 C32 25.5, 39.5 32, 48 32 C39.5 32, 32 38.5, 32 47 C32 38.5, 24.5 32, 16 32 C24.5 32, 32 25.5, 32 17 Z" fill="url(#sparkGrad)" filter="url(#agentGlow)"/>
  <!-- Central Micro Core -->
  <circle cx="32" cy="32" r="3.2" fill="#E40000"/>
  <circle cx="32" cy="32" r="1.4" fill="#FFFFFF"/>
  <!-- Satellite Nodes -->
  <circle cx="49" cy="21" r="2.2" fill="#FFFFFF"/>
  <circle cx="15" cy="43" r="2.2" fill="#FFFFFF"/>
</svg>
