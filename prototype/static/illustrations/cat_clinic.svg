  <path d="M12 18 A6 6 0 0 1 20 18" stroke="#42846A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M9 14 A10 10 0 0 1 23 14" stroke="#577A9D" stroke-width="1.5" stroke-linecap="round" fill="none"/>
