  <line x1="14" y1="50" x2="14" y2="58" stroke="#20252D" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="58" stroke="#20252D" stroke-width="2" stroke-linecap="round"/>

  <!-- Laptop on Desk -->
  <rect x="20" y="32" width="24" height="15" rx="2" fill="#FFFFFF" stroke="#20252D" stroke-width="1.8"/>
  <line x1="17" y1="47" x2="47" y2="47" stroke="#20252D" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="23" y="35" width="18" height="9" rx="1" fill="#F4F3EF"/>
  <line x1="26" y1="38" x2="35" y2="38" stroke="#577A9D" stroke-width="1.2"/>
  <line x1="26" y1="41" x2="38" y2="41" stroke="#577A9D" stroke-width="1.2"/>

