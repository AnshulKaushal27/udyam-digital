  <line x1="13" y1="43" x2="16" y2="43" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Secure Cloud Backup / Health Shield Floating Above -->
  <g transform="translate(38, 12)">
    <path d="M10 2 C16 2 20 5 20 10 C20 18 10 24 10 24 C10 24 0 18 0 10 C0 5 4 2 10 2 Z" fill="#FFFFFF" stroke="#E31E24" stroke-width="1.8"/>
