<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ground Line -->
  <line x1="6" y1="54" x2="58" y2="54" stroke="#20252D" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Factory Sawtooth Structure -->
  <path d="M10 54 L10 32 L20 22 L20 32 L30 22 L30 32 L40 22 L40 54 Z" fill="#FFFFFF" stroke="#20252D" stroke-width="1.8"/>

  <!-- Industrial High Bay Doors & Window Grid -->
  <rect x="18" y="40" width="14" height="14" rx="1" fill="#F4F3EF" stroke="#20252D" stroke-width="1.5"/>
  <line x1="25" y1="40" x2="25" y2="54" stroke="#20252D" stroke-width="1.2"/>
  
  <rect x="34" y="32" width="4" height="5" rx="0.5" fill="#577A9D"/>
  <rect x="34" y="39" width="4" height="5" rx="0.5" fill="#577A9D"/>

  <!-- IoT Telemetry / Sensor Gear -->
  <g transform="translate(42, 34)">
    <circle cx="10" cy="10" r="7" fill="#F4F3EF" stroke="#D89A43" stroke-width="1.5"/>
    <circle cx="10" cy="10" r="2.5" fill="#20252D"/>
    <!-- Gear notches -->
    <line x1="10" y1="1" x2="10" y2="3" stroke="#D89A43" stroke-width="1.5"/>
    <line x1="10" y1="17" x2="10" y2="19" stroke="#D89A43" stroke-width="1.5"/>
    <line x1="1" y1="10" x2="3" y2="10" stroke="#D89A43" stroke-width="1.5"/>
    <line x1="17" y1="10" x2="19" y2="10" stroke="#D89A43" stroke-width="1.5"/>
  </g>

  <!-- Dedicated Leased Line Tower & Signal -->
  <g transform="translate(46, 8)">
    <line x1="4" y1="20" x2="4" y2="4" stroke="#20252D" stroke-width="1.8"/>
    <circle cx="4" cy="4" r="2" fill="#E31E24"/>
    <!-- Dedicated Leased Line Signal Arcs -->
    <path d="M0 1 A6 6 0 0 1 8 1" stroke="#E31E24" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M-3 -3 A10 10 0 0 1 11 -3" stroke="#42846A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
